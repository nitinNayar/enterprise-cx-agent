[mypy]
# Python version we're using
python_version = 3.11

# Start lenient - we're learning!
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Warn about obvious mistakes
warn_redundant_casts = True
warn_unused_ignores = True

# Show error codes (helps you learn what each error means)
show_error_codes = True

# Third-party libraries that don't have type hints
# mypy will ignore type errors from these imports
[mypy-chainlit]
ignore_missing_imports = True

[mypy-chainlit.*]
ignore_missing_imports = True

[mypy-anthropic]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-dotenv]
ignore_missing_imports = True

[mypy-kuzu]
ignore_missing_imports = True

[mypy-phoenix]
ignore_missing_imports = True

[mypy-openinference.*]
ignore_missing_imports = True

[mypy-opentelemetry.*]
ignore_missing_imports = True